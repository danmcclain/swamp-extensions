manifestVersion: 1
name: "@dmc/patch"
version: "2026.11.11.1"
description: "Agentless fleet patch management — scan Proxmox VMs/CTs, bare-metal, and VPS hosts for pending updates, apply them safely (snapshot-guarded, health-checked, auto-rollback), and keep an auditable history over @swamp/ssh. Routine work runs as a restricted, audited login with exact sudo grants and a per-machine OS update policy. App updaters, snapshotters and OS updaters are pluggable: bring your own model without upstreaming it. Built-in OS support: apt, dnf, apk and pacman"
repository: "https://github.com/danmcclain/swamp-extensions"
license: MIT
labels:
  - patch
  - infrastructure
  - proxmox
dependencies:
  - "@swamp/ssh"
  - "@dmc/proxmox"
models:
  - patch_fleet.ts
reports:
  - patch_status.ts
  - patch_history.ts
  - patch_prune_history.ts
  - patch_access.ts
additionalFiles:
  - README.md
  - LICENSE.md
