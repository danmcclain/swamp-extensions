# Checks every pull request and every push to main: runs each extension's
# Deno tests. It runs on the runner pool (runs-on: bootc, a host runner on a
# one-job VM) and needs no secret. main's branch protection requires
# "test / test (pull_request)", so keep the workflow and job names.
#
# --no-check: the test files of fastmail, patch and proxmox do not type-check
# yet (test doubles narrower than MethodContext, implicit any). Drop the flag
# once `deno test` type-checks cleanly in every extension.
name: test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: bootc
    timeout-minutes: 20
    steps:
      - uses: https://code.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Not denoland/setup-deno: it extracts with unzip, which the runner
      # image lacks. Pin the version and the sha256 from its .sha256sum
      # file; python3's zipfile does the extracting.
      - name: Install Deno
        env:
          DENO_VERSION: v2.7.1
          DENO_SHA256: b7154ae42839d7b1453422e2f33c907e5c68fde8fe9f145cd43b8dd083671a6f
        run: |
          dir="$RUNNER_TEMP/deno"
          mkdir -p "$dir"
          curl -fsSL --proto '=https' -o "$dir/deno.zip" \
            "https://github.com/denoland/deno/releases/download/${DENO_VERSION}/deno-x86_64-unknown-linux-gnu.zip"
          echo "${DENO_SHA256}  $dir/deno.zip" | sha256sum -c -
          python3 -m zipfile -e "$dir/deno.zip" "$dir"
          chmod 0755 "$dir/deno"
          rm "$dir/deno.zip"
          echo "$dir" >> "$GITHUB_PATH"
          "$dir/deno" --version

      - name: fastmail
        working-directory: fastmail
        run: deno test -A --no-check

      - name: patch
        working-directory: patch
        run: deno test -A --no-check

      - name: proxmox
        working-directory: proxmox
        run: deno test -A --no-check

      - name: unifi-networks
        working-directory: unifi-networks
        run: deno test -A --no-check
